trainer:
  experiment_name: stage-c-chebykan-top20-tune
  train_csv: data/prudential-life-insurance-assessment/train.csv
  test_csv: data/prudential-life-insurance-assessment/test.csv
  seed: 42

preprocessing:
  contract_version: 1
  recipe: kan_paper
  selected_features_path: configs/experiment_stages/stage_c_explanation_package/feature_lists/chebykan_pareto_q0583_top20_features.json

# Architecture/HP baseline mirrors Cyril's full-feature tuned dense ChebyKAN
# (configs/.../cheby/all_features/train/chebykan_best.yaml). LayerNorm is
# turned off so the §3.2 closed-form composition story holds at 20 features.
# sparsity_lambda is fixed to the strong sparse-reference value picked from
# the 20-feature Pareto sweep at sweeps/stage_c/chebykan/20_features/
# stage-c-chebykan-top20-pareto-sparsity_pareto.json (trial 1, λ=0.0130862,
# QWK 0.5795, sparsity_ratio 0.9555).
model:
  name: tabkan-base
  flavor: chebykan
  hidden_widths: [128]
  degree: 5
  use_layernorm: false
  params:
    max_epochs: 100
    lr: 0.0008814400571473658
    weight_decay: 0.00009472373311076866
    batch_size: 256
    sparsity_lambda: 0.0130862
    l1_weight: 1.0
    entropy_weight: 1.0

tune:
  name: stage-c-chebykan-top20-tune
  storage: sweeps/stage_c/chebykan/20_features/stage-c-chebykan-top20-tune.db
  n_trials: 50
  timeout: null
  sampler: tpe
  top_k_candidates: 1
  search_space:
    depth:
      type: int
      low: 1
      high: 3
    width:
      type: categorical
      choices: [32, 64, 128, 256]
    degree:
      type: int
      low: 2
      high: 8
    max_epochs:
      type: categorical
      choices: [75, 100, 150, 200]
    lr:
      type: log_uniform
      low: 0.0001
      high: 0.05
    weight_decay:
      type: log_uniform
      low: 0.000001
      high: 0.01
    batch_size:
      type: categorical
      choices: [256, 512, 1024, 2048]
